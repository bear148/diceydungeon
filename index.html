<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="start-menu">
            <h1>Dicey Dungeons</h1>
            <button id="startGame">Start Game</button>
        </div>
        <div id="game-container">
            <div id="menu" class="hidden">
                <h1>Pick A Dungeon</h1>
                <div id="dungeon-container">
                    <div class="dungeon" data-dungeon-id="0" data-dungeon-name="muddy_swamp">
                        <img class="dungeon-icon" src="/assets/swamp.png" alt="Muddy Swamp">
                        <h2>Muddy Swamp</h2>
                    </div>
                    <div class="dungeon" data-dungeon-id="1" data-dungeon-name="haunted_crypt">
                        <img class="dungeon-icon" src="/assets/crypt.png" alt="Haunted Crypt">
                        <h2>Haunted Crypt</h2>
                    </div>
                    <div class="dungeon" data-dungeon-id="2" data-dungeon-name="fury_cave">
                        <img class="dungeon-icon" src="/assets/cave.png" alt="Fury Cave">
                        <h2>Fury Cave</h2>
                    </div>
                    <div class="dungeon" data-dungeon-id="3" data-dungeon-name="forsaken_island">
                        <img class="dungeon-icon" src="/assets/island.png" alt="Forsaken Island">
                        <h2>Forsaken Island</h2>
                    </div>
                    <div class="dungeon" data-dungeon-id="4" data-dungeon-name="temple_of_gods">
                        <img class="dungeon-icon" src="/assets/temple.png" alt="Temple of Gods">
                        <h2>Temple of Gods</h2>
                    </div>
                </div>
                <button id="bindAttacks">Bind Attacks</button>
                <a href="/index.html">Back</a>
            </div>
            <div id="combat-container" class="hidden">
                <h1 id="dungeon-title"></h1>
                <h2 id="enemy-counter">0/0</h2>
                <div id="sprite-container">
                    
                    <img src="/assets/player.png" id="player-sprite" alt="Player Sprite">
                    <div id="enemy-sprite-container">
                        
                    </div>
                </div>
                <div id="dice-container" class="hidden">
                    <img class="die" src="/assets/dice/1.png" alt="Die">
                </div>
                <div id="control-container" class="hidden">
                    <button id="roll-die">Roll the Dice</button>
                </div>
                <div id="info-container" class="hidden">
                    <h3>Health: <span id="player-health">0</span></h3>
                    <h3>Mana: <span id="player-mana">0</span></h3>
                </div>
            </div>
        </div>
        <p id="credit">Made by Michael S.</p>
        <script src="/js/index.js" type="module" defer></script>
    </body>
</html>
